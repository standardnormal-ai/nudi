[project]
name = "nudi-cli"
version = "0.5.2"
description = "Pre-hack and simulate Harbor RL environments"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "verifiers[harbor]==0.4.1.dev12",
    "harbor==0.24.0",
    "litellm==1.106.0",
    "deepagents==0.7.32",
    "langchain-litellm==0.11.1",
    "langchain==1.4.7",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
]

[project.urls]
Homepage = "https://github.com/standardnormal-ai/nudi"
Documentation = "https://github.com/standardnormal-ai/nudi/tree/main/docs"
Issues = "https://github.com/standardnormal-ai/nudi/issues"

[project.scripts]
nudi = "nudi.cli:main"

[project.optional-dependencies]
test = ["pytest"]
# The installed modal is pinned so the snapshot API cannot drift.
modal = ["harbor[modal]==0.24.0", "modal==1.6.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["src", "LICENSE", "readme.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/nudi"]
