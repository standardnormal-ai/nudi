[project]
name = "nudi"
version = "0.3.0"
description = "Pre-hack and simulate Harbor RL environments"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "verifiers[harbor]==0.4.1.dev12",
    "harbor==0.24.0",
    "litellm==1.106.0",
    "deepagents==0.7.32",
    "langchain-litellm==0.11.1",
    "langchain==1.4.7",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
]

[project.scripts]
nudi = "nudi.cli:main"

[project.optional-dependencies]
test = ["pytest"]
# The installed modal is pinned so the snapshot API cannot drift.
modal = ["harbor[modal]==0.24.0", "modal==1.6.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
