[project]
name = "nudi"
version = "0.0.1"
description = "Inspect Harbor RL tasks by running and retaining episodes."
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "verifiers[harbor]==0.4.1.dev12",
    "harbor==0.24.0",
    "litellm==1.106.0",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
